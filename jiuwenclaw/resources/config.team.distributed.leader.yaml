react:
  a2x_registry:
    # Leader reserves blank teammates from this registry before sending bootstrap.
    base_url: "http://127.0.0.1:8000"
    timeout: 30.0
    api_key: ""
    ownership_file: false
    role: "teamleader"
    dataset: "team_pool"
    endpoint: ""
    reservation_ttl_seconds: 30

team:
  runtime:
    mode: distributed
    role: leader

  team_name: jiuwen_team
  lifecycle: persistent
  teammate_mode: build_mode
  spawn_mode: process

  leader:
    member_name: team_leader
    display_name: 团队领导
    persona: "天才项目管理专家，擅长任务分解和团队协调"

  transport:
    type: pyzmq
    params:
      request_timeout: 20
      # Leader data/control endpoints. Teammates are discovered from A2X registry
      # at spawn time, so this config does not need static teammate peer routes.
      direct_addr: tcp://0.0.0.0:28555
      pubsub_publish_addr: tcp://127.0.0.1:28556
      pubsub_subscribe_addr: tcp://127.0.0.1:28557
      metadata:
        pubsub_bind: true

  storage:
    type: postgresql
    params:
      # Shared DB with teammate side.
      connection_string: postgresql://postgres:postgres@127.0.0.1:5432/jiuwen_team
