team:
  runtime:
    mode: distributed
    role: leader

  team_name: jiuwen_team
  lifecycle: persistent
  teammate_mode: build_mode
  spawn_mode: process

  leader:
    member_name: team_leader
    display_name: 团队领导
    persona: "天才项目管理专家，擅长任务分解和团队协调"

  transport:
    type: pyzmq
    params:
      request_timeout: 20
      # Leader data/control endpoints
      direct_addr: tcp://0.0.0.0:28555
      pubsub_publish_addr: tcp://127.0.0.1:28556
      pubsub_subscribe_addr: tcp://127.0.0.1:28557
      # Data-plane route (leader -> teammate TeamAgent)
      known_peers:
        - agent_id: teammate_1
          addrs:
            - tcp://127.0.0.1:28600
      # Control-plane bootstrap route (leader -> teammate bootstrap listener)
      bootstrap_known_peers:
        - agent_id: teammate_1
          addrs:
            - tcp://127.0.0.1:28610
      # Keep for compatibility with existing messager bootstrap behavior.
      bootstrap_peers:
        - agent_id: teammate_1
          addrs:
            - tcp://127.0.0.1:28600
      metadata:
        pubsub_bind: true

  storage:
    type: postgresql
    params:
      # Shared DB with teammate side.
      connection_string: postgresql://postgres:postgres@127.0.0.1:5432/jiuwen_team
