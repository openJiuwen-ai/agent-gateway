team:
  runtime:
    # distributed 模式下，team 在收到 team 请求后懒创建
    mode: distributed
    # 当前 claw 运行角色：leader / teammate
    role: leader
    # 可选：teammate 侧建议显式指定本进程 member_name
    # member_name: teammate_1

  # Team identity
  team_name: jiuwen_distributed_team
  lifecycle: persistent
  teammate_mode: build_mode
  # Use process mode for distributed leader/teammate runtime.
  spawn_mode: process

  leader:
    member_name: team_leader
    display_name: TeamLeader
    persona: "负责任务拆解与调度的团队领导"

  # Pre-declare teammate(s); leader will register these members at bootstrap.
  predefined_members:
    - member_name: teammate_1
      display_name: TeammateOne
      role_type: teammate
      persona: "执行型 teammate，按 leader 指令完成任务"
      prompt_hint: "优先执行 leader 分配任务，输出简洁可执行结论。"

  # Keep only team topology and transport here.
  # Model config is unified in main config.yaml -> models.default.
  # If you need per-role tuning, set only non-model fields in agents below.
  # agents:
  #   leader:
  #     max_iterations: 100
  #   teammate:
  #     max_iterations: 100

  # pyzmq transport works for both single-machine multiprocess and multi-host.
  transport:
    type: pyzmq
    params:
      request_timeout: 20
      # --- Preferred runtime-ready fields (reduces mapping in TeamManager) ---
      # Leader example:
      #   role=leader
      #   direct_addr=tcp://0.0.0.0:18555
      #   known/bootstrap peer -> teammate_1@tcp://127.0.0.1:18600
      #   metadata.pubsub_bind=true
      #
      # Teammate example:
      #   role=teammate
      #   direct_addr=tcp://0.0.0.0:18600
      #   known/bootstrap peer -> team_leader@tcp://127.0.0.1:18555
      #   metadata.pubsub_bind=false
      direct_addr: tcp://0.0.0.0:18555
      pubsub_publish_addr: tcp://127.0.0.1:18556
      pubsub_subscribe_addr: tcp://127.0.0.1:18557
      known_peers:
        - agent_id: teammate_1
          addrs:
            - tcp://127.0.0.1:18600
      bootstrap_peers:
        - agent_id: teammate_1
          addrs:
            - tcp://127.0.0.1:18600
      metadata:
        pubsub_bind: true

      # --- Backward-compatible topology block (kept for older configs/tools) ---
      leader:
        # single-machine: keep 127.0.0.1
        # multi-host: set to leader machine IP/DNS
        host: 127.0.0.1
        bind_host: 0.0.0.0
        direct_port: 18555
        pub_port: 18556
        sub_port: 18557
      teammate:
        # single-machine: keep 127.0.0.1
        # multi-host: set to teammate machine IP/DNS
        host: 127.0.0.1
        bind_host: 0.0.0.0
        direct_port: 18600

  # Use a shared db path visible to all participant processes.
  storage:
    type: sqlite
    params:
      connection_string: /tmp/jiuwen_team.distributed.db
