[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenclaw-ee-runtime-management-deps"
version = "0.1.0"
description = "Pip dependencies for jiuwenclaw_ee extensions.runtime_management_extension"
requires-python = ">=3.11.4,<3.14"
license = { text = "Apache-2.0" }
# 本扩展的南向实现只依赖 httpx 与协议包（见仓根 pyproject），不 import
# agent-runtime 的管理 SDK，因此这里不声明额外依赖。
dependencies = []

[tool.setuptools]
# 纯元数据包：不含任何模块，只把扩展的依赖声明带给 pip。
# （原先的 py-modules 指向一个本仓不存在的占位文件，构建时会产生警告。）
packages = []
py-modules = []
