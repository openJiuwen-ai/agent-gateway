# 应用版本与打包日期：例如 "0.2.8 · 2026-10-26"，日期按 UTC+08:00 记录。
# 启动时自动同步；保留 WHL 完整版本后缀，旧包或源码无日期时仅写版本号。
config_version: ""

# 前端显示语言：zh（中文）/ en（英文），与 Web 界面语言切换同步
preferred_language: zh

# 日志目录：~/.jiuwenswarm/agent/.logs/
# gateway.log / channel.log / agent_server.log 按源码路径分流；full.log 为汇总（不含 gateway 日志）。
# level：未单独指定时的默认级别。console_level：控制台；可省略则用 level。
# 环境变量 LOG_LEVEL 仅覆盖控制台级别（不覆盖各日志文件）。
logging:
  level: INFO
  console_level: INFO
  gateway: INFO
  channel: INFO
  agent_server: INFO
  full: INFO

models:
  defaults:
    - model_id: mdl_default_primary
      model_client_config:
        api_base: ${API_BASE}
        api_key: ${API_KEY}
        model_name: ${MODEL_NAME}
        client_provider: ${MODEL_PROVIDER}
        # endpoint_profile：仅 OpenAI 协议(client_provider=OpenAI)生效的端点方言。
        #   openai(官方/默认)、deepseek、openrouter、siliconflow、dashscope、
        #   openai_compatible(KV释放/亲和)、ollama、lmstudio、vllm、sglang。
        #   client_provider=Anthropic 时此字段被忽略。
        #   若用 ${MODEL_PROVIDER}=DeepSeek/SiliconFlow/DashScope/OpenRouter 等旧别名，
        #   core 内部会归一，但方言更稳妥的做法是这里显式填 endpoint_profile。
        endpoint_profile: ${ENDPOINT_PROFILE:-openai}
        # HTTP 请求超时（秒）。需严格 > stream_first_chunk_timeout，确保先触发应用层流超时（可被 ModelAnomalyDetectionRail 重试）
        timeout: 360
        # 流式：等待首个分片的最大时间（秒）。放宽以兼容 reasoning/思考模型思考期的静默
        stream_first_chunk_timeout: 300
        # 流式：分片之间的最大空闲等待时间（秒）
        stream_idle_timeout: 120
        verify_ssl: true
        custom_headers: {}
        # 该模型是否接受图片输入（原生多模态）。可选键，默认不填。
        #   true： 直接按「支持」处理。
        #   false：不向该模型发送原生图片输入，且服务启动时不再为该条目发探测请求。
        #   不填： 视为「未声明」，交给 react.enable_read_image_multimodal，
        #          再退回启动探测（image_modality_warmup）得出的结论。
        # 优先级：supports_vision > react.enable_read_image_multimodal > 探测缓存。
        # 纯文本模型建议显式填 false。探测会发一张纯红小图并问「这是什么颜色」，
        # 判定标准是回答里是否出现该颜色词。收不到图的文本模型也可能猜中 red，
        # 于是被误判成支持图片输入。
        # 这里写成注释而非实体键：不填即「未声明」，填 null 同理。
        # 留一行注释是为了让需要的人照抄，而不是让每个条目都多出一个空键。
        # supports_vision: false
      model_config_obj: {}
        # 模型支持的上下文总长度（tokens）。每个模型条目均可配（与 timeout 一样，
        # defaults / agentos / video / audio / vision / image_gen 均可填）。
        # 经 _build_model_from_entry 放进 core 的 ModelRequestConfig，供 core 从
        # ModelRequestConfig 取值（core 侧加 context_window 正式字段后读取）。
        # "模型侧不会感知" = 不发往厂商，由 jiuwenswarm 出口按 core 字段状态自动适配
        # （reasoning_injector.core_has_context_window_field）：core 未把 context_window
        # 加为 ModelRequestConfig 正式字段时，它进 extra 会被 base_model_client 经
        # model_dump 透传给厂商 SDK 报 unexpected keyword argument，故此时 jiuwenswarm
        # 公共出口对 context_window 统一 pop 防发厂商；core 加正式字段后
        # （届时 core 自行 exclude 不发厂商、self.model_config.context_window 可读），
        # jiuwenswarm 自动停止 pop，把值留给 core。无需人工同步。
        # 未显式填写时，JiuwenSwarm 使用固定的 256K 上下文默认值。
        # 如需覆盖默认值，可在 model_config_obj 下配置 context_window。
      is_default: true
  # 备份模型条目，与 defaults 同构、同等可选可切换，但 is_default 恒为 false，
  # 绝不抢启动主对话默认；前端置灰只读展示。get_agentos_models 读取本字段，
  # 每条需自行填入 model_client_config.model_name 等凭证才生效。
  # 这里留空而不是写 [] 或示例条目：本模板同时充当升级时的键白名单，
  # 缺席的键会被 _deep_merge 从用户配置里删除，而写成映射/列表又会连同
  # 用户手工添加的条目一起被覆盖。留空值即"未配置"，用户填什么保留什么。
  agentos:
  video:
      model_client_config:
        api_base: ${VIDEO_API_BASE}
        api_key: ${VIDEO_API_KEY}
        model_name: ${VIDEO_MODEL_NAME}
        client_provider: ${VIDEO_PROVIDER}
        # 端点方言；若走 DashScope 多模态口填 dashscope，否则 openai/openai_compatible。
        endpoint_profile: ${VIDEO_ENDPOINT_PROFILE:-openai_compatible}
        timeout: 1800
        verify_ssl: true
      model_config_obj: {}
  audio:
      model_client_config:
        api_base: ${AUDIO_API_BASE}
        api_key: ${AUDIO_API_KEY}
        model_name: ${AUDIO_MODEL_NAME}
        client_provider: ${AUDIO_PROVIDER}
        # 端点方言；若走 DashScope 多模态口填 dashscope，否则 openai/openai_compatible。
        endpoint_profile: ${AUDIO_ENDPOINT_PROFILE:-openai_compatible}
        verify_ssl: true
        timeout: 1800
      model_config_obj: {}
  vision:
      model_client_config:
        api_base: ${VISION_API_BASE}
        api_key: ${VISION_API_KEY}
        model_name: ${VISION_MODEL_NAME}
        client_provider: ${VISION_PROVIDER}
        # 端点方言；若走 DashScope 多模态口填 dashscope，否则 openai/openai_compatible。
        endpoint_profile: ${VISION_ENDPOINT_PROFILE:-openai_compatible}
        verify_ssl: true
        timeout: 1800
      model_config_obj: {}
  image_gen:
      model_client_config:
        api_base: ${IMAGE_GEN_API_BASE}
        api_key: ${IMAGE_GEN_API_KEY}
        model_name: ${IMAGE_GEN_MODEL_NAME}
        client_provider: ${IMAGE_GEN_PROVIDER}
        # 多模态生成(生图)走 DashScope SDK 必须带 endpoint_profile=dashscope，
        # 否则 OpenAIModelClient 拒绝该操作。client_provider 仍为 OpenAI。
        endpoint_profile: ${IMAGE_GEN_ENDPOINT_PROFILE:-dashscope}
        verify_ssl: true
        timeout: 1800
      model_config_obj: {}
  # ---- AgentOS 备份模型（可选，不预置；需手动添加）----
  # 此处不预置任何 agentos 条目：jiuwenswarm-init 生成的 config.yaml 不含 agentos 字段。
  # 如需启用备份模型，请手动在 config.yaml 添加 models.agentos 列表段（见文档）。
  # 配置后 AgentServer 启动/热重载时自动检测加载，与 defaults 同等可选可切换，
  # 但 is_default 始终为 false，不抢启动主对话默认。
  # 列表结构，可配多个备份模型，凭证直接填在 YAML，无环境变量。
  # 每个元素一个模型；model_name 为空 = 该条未配置，跳过不入缓存。
  # 填入后通过 models.list 可见、可按名切换，但不带 is_default，
  # 绝不抢主对话，仅在被显式选中时使用。
  # 可配多条备份模型。填写约束：(model_name, api_base, api_key) 三元组唯一，
  # 即不存在完全相同的两条；同名（base 或 key 不同）可共存，靠缓存
  # {model_name}#{index} 区分。
  # context_window：模型支持的上下文总长度（tokens）。每个模型条目均可配
  #   （defaults / agentos / video / audio / vision / image_gen 均可填，
  #   放在各自 model_config_obj 段下，与 timeout 同为每模型可配项）。
  #   经 _build_model_from_entry 放进 core 的 ModelRequestConfig，供 core 人员
  #   从 ModelRequestConfig 取值（core 侧加 context_window 正式字段后读取）。
  #   "模型侧不会感知" = 不发往厂商，由 jiuwenswarm 出口按 core 字段状态自动适配
  #   （reasoning_injector.core_has_context_window_field）：core 未把 context_window
  #   加为 ModelRequestConfig 正式字段时，它进 extra 会被 base_model_client 经
  #   model_dump 透传给厂商 SDK 报 unexpected keyword argument，故此时 jiuwenswarm
  #   公共出口对 context_window 统一 pop 防发厂商；core 加正式字段后
  #   （届时 core 自行 exclude 不发厂商、self.model_config.context_window 可读），
  #   jiuwenswarm 自动停止 pop，把值留给 core。无需人工同步。
  #   不填 = JiuwenSwarm 使用固定的 256K 上下文默认值。
  # agentos:
  #   - model_client_config:
  #       api_base: ""
  #       api_key: ""
  #       model_name: ""
  #       client_provider: ""
  #       verify_ssl: true
  #       timeout: 1800
  #     model_config_obj:
  #       temperature: 0.95
  #       context_window: 262144
  # Model groups reference models by stable model_id. Route order is the only
  # primary/fallback order; routes[0] is primary.
  # Defaults for groups without their own routing timeouts. A group may override
  # these under groups[].routing with timeout_seconds, stream_first_chunk_timeout,
  # and stream_idle_timeout. Individual route timeouts take precedence.
  group_routing_timeout_seconds: ${JIUWENSWARM_MODEL_GROUP_TIMEOUT_SECONDS:-360}
  # Streaming timeouts are stored per group for future support; IntelliRouter does not consume them yet.
  group_stream_first_chunk_timeout_seconds: ${JIUWENSWARM_MODEL_GROUP_STREAM_FIRST_CHUNK_TIMEOUT_SECONDS:-300}
  group_stream_idle_timeout_seconds: ${JIUWENSWARM_MODEL_GROUP_STREAM_IDLE_TIMEOUT_SECONDS:-120}
  groups: []

# ============================================================
# Agent 配置（可被 team.agents / modes.team.<name>.agents 引用）
# ============================================================
# 每个 agent 定义一个可复用的 agent 配置模板，支持以下字段（均可选）：
#
#   model:                  # 不配则继承 models.default
#     model_client_config:
#       client_provider: OpenAI
#       api_base: https://api.deepseek.com
#       api_key: sk-xxx
#       timeout: 1800
#       verify_ssl: true
#       custom_headers: {}
#     model_request_config:
#       model: deepseek-chat
#   skills:                 # 不配则不自动填充
#     - skill_a
#     - skill_b
#   workspace:              # 默认 {"stable_base": true}
#     stable_base: true
#   max_iterations: 200     # 默认 200
#   completion_timeout: 600.0  # 默认 600.0
#
# 示例：给不同 agent 配置不同模型和技能
#   agent_coder:
#     model:
#       model_client_config:
#         client_provider: OpenAI
#         api_base: https://api.deepseek.com
#         api_key: sk-xxx
#       model_request_config:
#         model: deepseek-chat
#     skills:
#       - code_review
#       - unit_test
#     max_iterations: 300
#
agents:
  agent_leader:
    workspace:
      stable_base: true
    # Leader 不受 max_iterations 限制，配置了也会被忽略，保证长程任务持续执行
    completion_timeout: 6000.0

  agent_teammate:
    workspace:
      stable_base: true
    max_iterations: 200
    completion_timeout: 6000.0

telemetry:
  enabled: false                    # 总开关（环境变量 OTEL_ENABLED 优先）
  exporter: otlp                    # otlp / console / none
  endpoint: http://localhost:4317   # OTLP endpoint
  protocol: grpc                    # grpc / http
  # 公共 OTLP headers，可被 traces/metrics 覆盖。留空而不是 {}：本模板同时
  # 充当升级时的键白名单，写成映射会被当作允许的子键全集，操作员自己加的
  # header 会被 _deep_merge 一并删掉。
  headers:
  log_messages: true                # 是否在 span event 中记录完整消息内容
  service_name: jiuwenswarm
  provider_factory:                 # 自定义 provider factory，格式：module:function
  traces:
    exporter:                       # trace exporter，默认回退到 telemetry.exporter
    endpoint:                       # trace endpoint，默认回退到 telemetry.endpoint
    protocol:                       # trace protocol，默认回退到 telemetry.protocol
    headers:                        # trace headers，默认回退到 telemetry.headers；留空而非 {}，理由同上
  metrics:
    exporter:                       # metrics exporter，默认回退到 telemetry.exporter
    endpoint:                       # metrics endpoint，默认回退到 telemetry.endpoint
    protocol:                       # metrics protocol，默认回退到 telemetry.protocol
    headers:                        # metrics headers，默认回退到 telemetry.headers；留空而非 {}，理由同上

session_cleanup:
  # Automatic expiry only; explicit session archive/delete operations remain available.
  # CLEANUP_PERIOD_DAYS overrides this setting when set.
  retention_days: 30                # Set 0 to keep sessions and file-operation logs indefinitely.

# standalone 不连接；active-standby / distributed 连接 Redis。
redis:
  mode: ${REDIS_MODE:-standalone}
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  username: ${REDIS_USER:-}
  db: ${REDIS_DB:-0}
  key_prefix: ${REDIS_KEY_PREFIX:-jiuwenclaw:}
  pool_size: ${REDIS_POOL_SIZE:-10}
  connect_timeout: ${REDIS_CONNECT_TIMEOUT:-5}
  operation_timeout: ${REDIS_OPERATION_TIMEOUT:-10}
  health_check_interval: ${REDIS_HEALTH_CHECK_INTERVAL:-30}

gateway:
  # standalone（默认）不连 Redis；distributed / active-standby 连接 Redis。
  deployment_mode: ${DEPLOYMENT_MODE:-standalone}
  instance_id: ${GATEWAY_INSTANCE_ID:-}
  # SessionMap 仅用于企业claw场景，如 feishu_enterprise 等通道：将平台身份映射为 Agent 的 session_id。
  # 取值：per_chat_bot（默认，同 chat+bot 共享会话）, per_chat_bot_user（按 user 分会话）
  session_map_scope: per_chat_bot

  # 数字分身：只存模型名；为空时使用 models.defaults 的默认模型。
  digital_avatar:
    model: ""

  # Cron 作业定义持久化，默认本地文件。etcd 仅 AgentOS 一体机模板配置。
  cron:
    store_backend: ${CRON_STORE_BACKEND:-file}
    # 以下两项仅在 store_backend=etcd 时生效，由 load_cron_store_settings 读取。
    # 留空表示未配置 etcd 地址：store_backend=etcd 而此处为空时不回退到文件，
    # 直接报错。值为逗号分隔的字符串或列表。
    etcd_endpoints:
    # 作业键前缀，与 EtcdCronJobStore 的默认值一致。
    etcd_prefix: /jiuwenswarm/cron/jobs/

  # AgentClient 配置 - Gateway 连接到 AgentServer 的方式
  # type: websocket（默认） | yuanrong（直接函数调用） | agentos_router（AgentOS 扩展）
  agent_client:
    type: websocket # websocket | yuanrong | agentos_router
    # yuanrong 函数模式配置下面参数
    frontend_endpoint:
    function_version_urn:
    concurrency: 1
    invoke_timeout_s: 60
    # POST/DELETE /api/agent 超时（秒）；create 含镜像拉取/容器启动，建议明显大于 invoke_timeout_s
    agent_timeout_s: 300
    # create 请求的 namespace，默认 default
    agent_namespace: default

  # AgentOS Router Extension 配置；agent_client.type=agentos_router 时生效。
  agentos:
    creating_timeout_seconds: 60
    # GET /api/agent/:id 等到 status=running 的超时（秒）。须覆盖一次 create
    # 的 startup 探针预算：initial_delay + period * failure_threshold
    #（builtin 默认 3+3*6=21；3rdagent 默认 2+3*8=26）。load_router_config
    # 取二者较大值，若本值更小则告警并抬到该下限。liveness 在 running 之后，
    # 不计入 GET 等待。环境变量 AGENTOS_WAIT_RUNNING_TIMEOUT_SECONDS 可覆盖。
    wait_running_timeout_seconds: 90
    # GET 轮询间隔（秒）。环境变量 AGENTOS_WAIT_RUNNING_INTERVAL_SECONDS 可覆盖。
    wait_running_interval_seconds: 1
    # YuanRong runtime_spec.probes。builtin 用这些时序打 18092；3rdagent 在
    # registry 未带 probes 时：未改本节/环境变量则用 delay=2/failure=8，
    # 有改动则与 builtin 共用配置打 SSH 2222。环境变量
    # AGENTOS_PROBE_STARTUP_* / AGENTOS_PROBE_LIVENESS_* 可覆盖对应字段。
    probes:
      startup:
        initial_delay_seconds: 3
        period_seconds: 3
        timeout_seconds: 2
        failure_threshold: 6
      liveness:
        timeout_seconds: 2
        failure_threshold: 3
    # Agent create 时宿主机 workspace 父目录；实际路径为 {workspace_root}/{user_id}
    workspace_root: "/home/agentos/users"
    # Agent 复用 key 字段，默认 user_id + agent_type。
    # 可选字段：user_id、agent_type、session_id（必须包含前两项）。
    # 示例：加入 session_id 后同一用户每个会话独立 Agent。
    agent_key_fields:
      - user_id
      - agent_type
    # Web/TUI 连接建立后后台预热内置 jiuwenswarm 沙箱并打通 instance WS，
    # 避免首条 chat 卡在 create + 冷启动 502 重试。失败不影响连接。
    connect_warmup_enabled: true
    # 空闲沙箱回收：agent 无持有任务（chat/SSH 均已结束）且空闲超过该时长后，
    # 自动 DELETE /api/agent 释放实例；<= 0 表示不回收。存活的 SSH 连接（即使
    # 不发消息）全程持有任务计数，不会被回收。环境变量
    # SANDBOX_IDLE_TIMEOUT_SECONDS 优先于本配置。
    sandbox_idle_timeout_seconds: 600
    # 空闲扫描周期（秒）
    sandbox_idle_check_interval_seconds: 30
    # 连接断开清理：用户连接数归零后，等待该时长再删除 jiuwenswarm agent
    # （给重连与 in-flight 的 chat/SSH 留出时间）。与 idle 回收共用 READY +
    # task_count==0 + 空闲超阈值的安全检查。环境变量
    # DISCONNECT_CLEANUP_TIMEOUT_SECONDS 优先于本配置。
    disconnect_cleanup_timeout_seconds: 60
    registry:
      # Agent OS 注册中心地址（空=本地 stub，不发 HTTP）。一体机默认 http://127.0.0.1:8000
      endpoint:
      request_timeout_s: 10
      # 本机 nodeIP，供 POST /api/nodes/{node}/heartbeat
      node:
    # SSH 南向接入 YuanRong 实例（配合 channels.ssh 北向使用）：
    # ssh -p <port> 'yr:instance:<instance_id>:port=2222'@<frontend-host>
    # 主机取自 agent_client.frontend_endpoint；<instance_id> 为 create agent 返回的实例 id。
    # 客户端私钥目录（默认 /root/.ssh；若模板含 {user_id} 则按用户替换）。
    ssh:
      port: 2222
      user_template: "yr:instance:{instance}:port=2222"
      connect_timeout_s: 30
      client_keys_dir: "/root/.ssh"
    auth_service_url: ${AGENTOS_AUTH_SERVICE_URL:-http://iam-agentos:8090}
    timeout: ${AGENTOS_AUTH_TIMEOUT:-10}
    # Web/TUI token 鉴权总开关；默认关闭。true 时创建 AgentOSAuthenticator 校验连接。
    auth_enabled: false

health_check:
  # 业务探活间隔（秒），默认 3600
  every: 3600
  # 探活结果回传的 channel（如 "web"），
  target: web
  # 探活生效时间段（本地时间），start <= now < end 时探活生效
  active_hours:
    start: 08:00
    end: 22:00

channels:
  web:
    send_file_allowed: true
  feishu:
    send_file_allowed: true
    apps:
      - name: 飞书默认应用
      # 飞书应用配置
        app_id:
        # 新版 JiuwenMate 可填 JM-02 同事 ID；留空时保持个人版消息路由
        persistent_agent_id:
        app_secret:
        encrypt_key:
        verification_token:
        allow_from:
        enable_streaming: false
        enabled: false
        # 群聊数字分身（默认关闭）
        group_digital_avatar: false
        my_user_id: ""
        bot_name: ""
        enable_memory: false
        # 飞书开放平台 API 域名前缀（留空走官方默认，支持国际版/私有化切换）
        api_base: https://open.feishu.cn
  feishu_enterprise:
    # 企业飞书多 Bot 配置（每个 bot 会注册为独立 channel: feishu_enterprise:<app_id>）
    # bot_a:
    #   app_id:
    #   persistent_agent_id:  # 可选：绑定到一个 JM-02 新版同事
    #   app_secret:
    #   encrypt_key:
    #   verification_token:
    #   allow_from: []
    #   enable_streaming: true
    #   chat_id:
    #   enabled: false
  welink:
    # 一个 AI 同事绑定一个 WeLink 账号。登录凭证写在 credential_dir，由办公室扫码写入。
    enabled: false
    account:
    persistent_agent_id:
    cli_path: welink-cli
    env: pro
    credential_dir:
    poll_interval_seconds: 5
  xiaoyi:
    # 小艺渠道不做文件回传：send_file_to_user 不注册给模型，
    # 相关提示词也不再要求它发文件（见 file_delivery_policy / TeamWorkspaceReportPathRail）。
    send_file_allowed: false
    apps:
      - name: 小艺默认应用
        # 华为小艺 A2A 配置
        app_id:
        mode: xiaoyi_channel
        ak:
        sk:
        api_id:
        push_id:
        agent_id:
        ws_url1: wss://hag.cloud.huawei.com/openclaw/v1/ws/link
        ws_url2: wss://116.63.174.231/openclaw/v1/ws/link
        enable_streaming: true
        enabled: false
        # xiaoyi_claw配置
        uid:
        api_key:
        push_url: https://hag.cloud.huawei.com/open-ability-agent/v1/agent-webhook
        file_upload_url:
        # 小艺手机端插件tools调用，会添加相关tools到系统提示词
        phone_tools_enabled: false
  dingtalk:
    # 钉钉应用配置
    client_id:
    client_secret:
    allow_from: []
    enabled: false
    send_file_allowed: true
    # API 域名前缀（留空走官方默认，支持私有化/国际版切换）
    api_base: https://api.dingtalk.com      # 新版 v1.0 接口域名
    oapi_base: https://oapi.dingtalk.com    # 旧版 media 接口域名
  telegram:
    # Telegram Bot 配置
    # 从 @BotFather 获取 bot_token
    bot_token:
    # 用户白名单（Telegram user_id），为空则允许所有用户
    allow_from: []
    # 消息解析模式: Markdown, HTML, None
    parse_mode: Markdown
    # 群聊模式: mention(仅响应@提及), reply(仅响应回复), all(响应所有), off(禁用群聊)
    group_chat_mode: mention
    enabled: false
  discord:
    # Discord Bot 配置（当前版本仅支持参数管理）
    # 可与用户私聊（DM）：仍受 allow_from 约束
    # Bot Token（Discord Developer Portal -> Bot）
    bot_token:
    # Application ID（Discord Developer Portal -> General Information）
    application_id:
    # 目标服务器 ID（Guild ID）
    guild_id:
    # 目标频道 ID（Channel ID）
    channel_id:
    # 用户白名单（Discord user_id），为空则允许所有用户
    allow_from: []
    # 是否关闭私信功能
    block_dm: false
    enabled: false
  slack:
    # Slack Bot via Socket Mode. Tokens are created in the Slack app settings.
    bot_token:
    app_token:
    # Slack user IDs allowed to use the bot. Empty allows all users.
    allow_from: []
    # Channel IDs allowed to mention the bot. Empty allows all channels.
    allowed_channel_ids: []
    # Optional fallback channel for messages without request metadata.
    default_channel_id:
    reply_in_thread: true
    enabled: false
  whatsapp:
    # WhatsApp 配置（通过本地 Baileys bridge）
    bridge_ws_url: ws://127.0.0.1:19600/ws
    default_jid:
    allow_from: []
    enable_streaming: true
    auto_start_bridge: false
    bridge_command: node scripts/whatsapp-bridge.js
    bridge_workdir:
    enabled: false
  wechat:
    # 个人微信 iLink Bot API 配置
    enable_streaming: false
    base_url: https://ilinkai.weixin.qq.com
    bot_token:
    ilink_bot_id:
    ilink_user_id:
    allow_from: []
    auto_login: true
    qrcode_poll_interval_sec: 2.0
    long_poll_timeout_sec: 45
    backoff_base_sec: 1.0
    backoff_max_sec: 30.0
    credential_file: ~/.wx-ai-bridge/credentials.json
    enabled: false
  wecom:
    # 企业微信 AI 机器人配置
    bot_id:
    secret:
    ws_url: wss://openws.work.weixin.qq.com
    allow_from: []
    enable_streaming: true
    send_thinking_message: false
    enabled: false
    send_file_allowed: true
    # 群聊数字分身（默认关闭）
    group_digital_avatar: false
    my_user_id: ""
    bot_name: ""
    enable_memory: false
  ssh:
    # SSH channel -> MessageHandler（北向）；南向经 agent_gateway.agent_client
    # （type=agentos_router 时由 AgentOS Router 创建 YuanRong 实例并
    # 以 yr:instance:<instance_id>:port=2222 中继到 frontend）。
    # 启用前请安装可选依赖: pip install "workswarm[ssh]" 或 uv sync --extra ssh
    # 客户端: ssh -p <listen_port> user@<gateway-host>
    # 南向连接参数见 agent_gateway.agentos.ssh；agent_type 跟随用户当前值（3rdagent.switch）。
    enabled: false
    listen_host: "0.0.0.0"
    listen_port: 2222
    host_key_path: ~/.jiuwenswarm/config/ssh_host_key
    relay_timeout_sec: 3600
    auth:
      # 公钥认证开关。true 时校验客户端公钥并签发临时密钥；false 为宽松认证。
      enabled: true
      # TUI 场景: 临时密钥有效期（秒）
      ephemeral_key_ttl_sec: 300
      # 临时密钥类型
      ephemeral_key_type: "ssh-ed25519"
      # 过期清理间隔（秒）
      cleanup_interval_sec: 60

  web_proxy:
    # 3rd-agent Web UI。端口由注册中心决定（写入 etcd），Gateway 只读并监听，
    # 不再本地分配。需要 agent_gateway.agent_client.type == agentos_router。
    # Gateway watch {A2X_REGISTRY_ETCD_NAMESPACE:-a2x-registry}/images/（无前导斜杠），
    # 取每条 data.access_mode 里 name=web_svc_port 的 port 监听；浏览器访问
    # http://<advertise_host>:<port>/?user_id=<uid>&token=<iam>（南向仍用 name=web 的口）。
    enabled: false
    auth_enabled: true
    listen_host: "0.0.0.0"
    advertise_host: ""
    # 会话 Cookie 的 Max-Age（秒）；端口空闲回收已取消。
    idle_timeout_sec: 900

browser:
  # Browser-only decisions. Existing LLM still handles fallback and final answers.
  decision:
    mode: llm # llm | shadow (observe only) | hybrid; shadow and hybrid need an openjiuwen with Jev
    provider: openrouter # openrouter | typesafe | custom
    model: typesafe/jev-1.13
    display_name: ""
    api_base: https://openrouter.ai/api/alpha
    # Use a dedicated OpenRouter key, or explicitly reference API_KEY if it is already an OpenRouter key.
    api_key_env: OPENROUTER_API_KEY
    # TypeSafe direct: provider=typesafe, model=jev-1.13.0,
    # api_base=https://api.typesafe.ai/v1, api_key_env=TYPESAFE_API_KEY.
    request_timeout_ms: 3000
    max_retries: 1
    max_decisions: 40 # Shared across LLM handoffs and focused resume in the same task.
    candidate_limit: 30 # Eligible controls, filtered and ranked before truncation.
    min_confidence: 0.55 # Initial routing threshold; calibrate on your own tasks.
    fallback_reserve_ms: 1000
  # chrome_path can be a string or per-OS map.
  # Example:
  # chrome_path:
  #   windows: "C:\\Users\\YOUR_USER\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe"
  #   macos: "/Applications/Google Chrome.app"
  #   linux: "/usr/bin/google-chrome"
  chrome_path: ""
  # true runs Chrome without a visible window; false opens a managed window.
  headless: true

updater:
  enabled: true
  # 桌面端版本检查源类型：gitcode / github
  desktop_release_api_type: "gitcode"
  repo_owner: openJiuwen
  repo_name: jiuwenswarm
  release_api_url: ""
  # Windows/macOS use .exe/.dmg; multiple candidates prefer a unique WorkSwarm name.
  # One pattern per platform, each falling back to asset_name_pattern below when
  # empty. UpdaterService reads all four and the Web settings page writes all
  # four, so all four are listed here: a key this template omits is deleted from
  # the operator's config on the next service start, which silently undid a
  # pattern set from the settings page.
  asset_name_pattern_windows: ""
  asset_name_pattern_macos: ""
  asset_name_pattern_linux: "JiuwenSwarm-{version}.tar.gz"
  # Fallback for whichever platform pattern above is left empty.
  asset_name_pattern: ""
  timeout_seconds: 20
  pypi_mirror: "https://mirrors.aliyun.com/pypi"

extensions:
  # 扩展包搜索目录（字符串），用 ';' 分割多个目录：
  # EXTENSION_DIRS="E:/a;D:/b"
  extension_dirs: ${EXTENSION_DIRS:-agent_gateway/extensions}

# ============================================================
# Hooks 配置
# 17 个事件类型，支持 command / prompt 两种 hook 类型
# 字段说明：
#   - disable_all_hooks: 全局关闭所有 hooks
#   - <事件名>:
#       - matcher: 匹配表达式（工具名|管道OR|正则|"*"）
#       - hooks:
#           - type: command | prompt
#           - command / prompt: 执行的命令或 prompt 模板
#             支持 $ARGUMENTS（hook input JSON）和 $TOOL_NAME 变量
#           - timeout: 超时秒数（默认 30s）
#           - shell: bash | sh | zsh（仅 command 类型）
#           - model: LLM 模型名（仅 prompt 类型，空则用默认轻量模型）
#           - status_message: 执行时显示的提示信息
# 退出码语义（command 类型）：
#   0 = 成功继续  2 = 阻止执行  其他 = 非阻塞错误
# ============================================================
hooks:
  disable_all_hooks: false

  # PreToolUse: 工具执行前拦截
  # PreToolUse:
  #   - matcher: "Write|Edit"
  #     hooks:
  #       - type: command
  #         command: "echo 'about to write file'"
  #         timeout: 30
  #         shell: "bash"
  #         status_message: "Running pre-write hook..."

  # PostToolUse: 工具执行后拦截
  # PostToolUse:
  #   - matcher: "Bash"
  #     hooks:
  #       - type: prompt
  #         prompt: "审查命令输出安全性: $ARGUMENTS"
  #         timeout: 15

  # SessionStart: 会话开始时
  # SessionStart:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'session started'"

  # Stop: Agent 结束前
  # Stop:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'agent stopping'"

modes:
  # 一级模式 agent / code / team
  agent:
    # plan / fast 已合并为单一 agent 模式：记忆固定被动（is_proactive 开关已下线）。
    memory:
      enabled: true
    rails:
    tools:
  code:
    # 记忆开关 — 控制 CodingMemoryRail 和 ProjectMemoryRail 加载
    # 关闭后，coding_memory_read/write/edit 工具不可用，项目记忆文件不自动加载
    memory:
      enabled: true

    # SDD 开关 — 控制 DesignRail 加载（wave1：需求分析与设计阶段）
    # 开启后对 Agent 说"需求分析"即进入 SDD 流程，按阶段产出 RAS/RDS
    # 关闭（默认）时 Agent 行为与未引入 SDD 旧版本完全一致（NFR-001）
    sdd:
      enabled: false

    # 动态 Rails — 列表中出现的 = 启用；不出现的 = 不启用
    # 固定 Rails（以下 Rails 已在代码中固定挂载，无需在此配置）：
    #   RuntimePromptRail, ResponsePromptRail, JiuSwarmStreamEventRail, SecurityRail,
    #   PermissionInterruptRail, SysOperationRail(FileSystemRail), LspRail,
    #   AgentModeRail, StructuredAskUserRail, ConfirmInterruptRail, ContextProcessorRail
    # 注意：ProjectMemoryRail, CodingMemoryRail 受 memory.enabled 开关控制，
    #       开关关闭时不加载，开关开启时固定挂载。
    #       TTSERail 受 react.ttse.enabled 控制（与 agent 模式同一开关），
    #       开启后挂载 FACT/TIP 双轨自演进；不要放进下方动态 rails 列表。
    rails:
      - SkillUseRail
      - WorktreeRail

    # 动态 Tools — 列表中出现的 = 启用
    # send_file_to_user 由运行时 _update_session_tools 注册，不在此配置
    # coding_memory_read/write/edit 由 CodingMemoryRail 在 subagent 内部注册，不在此配置
    tools:
      - web_free_search
      - web_fetch_webpage
      - web_paid_search
      - user_todos
      - skill_toolkit
      - skill_retrieval

    embedding_config:
      model_name: null
      base_url: null
      api_key: null
  team:
    jiuwen_team:
      team_name: jiuwen_team
      lifecycle: persistent
      teammate_mode: build_mode
      spawn_mode: inprocess
      enable_swarmflow: false
      # Progressive tool exposure for swarmflow workers: workers see only the
      # tool_search meta-tool plus a small direct set and search for the rest
      # on demand, cutting per-call context. Only effective when
      # enable_swarmflow is true. Independent of the top-level
      # progressive_tool_enabled (single-agent) switch. Takes effect for
      # teams created after the change.
      swarmflow_progressive_tool: false
      external_cli_agents: []
      external_transport: null

      # Team-level token budget ceiling for swarmflow runs.
      # Unset / null = unbounded (no ceiling).  Set to a positive integer to
      # cap total tokens across ALL swarmflow runs spawned by this team.
      # swarmflow_budget: 500000

      # Proactive reliability monitoring for team leaders and teammates.
      reliability:
        enabled: true
        monitor_roles:
          - leader
          - teammate

        detectors:
          tool_error:
            enabled: true
            window_seconds: 60.0
            rate_threshold: 5
            consecutive_threshold: 3

          repeat_tool:
            enabled: true
            history_size: 30
            repeat_warn: 10
            pingpong_warn: 10
            loop_block: 20
            global_stop: 30

          model_error:
            enabled: true
            window_seconds: 120.0
            rate_threshold: 3
            consecutive_threshold: 2

          output_length:
            enabled: true
            text_threshold: 32000
            thinking_threshold: 16000

          compaction:
            enabled: true
            window_seconds: 300.0
            frequency_threshold: 3
            drop_ratio: 0.3

          pingpong:
            enabled: true
            min_volleys: 6

        policy:
          severity_actions:
            low:
              - observe_only
            medium:
              - report_leader
            high:
              - local_steer
              - report_leader
            critical:
              - local_steer
              - escalate_user

        restart_intensity:
          intensity: 5
          period_seconds: 60.0

      # SwarmFlow per-Leader concurrency caps (three-layer governor).
      # Only effective when enable_swarmflow is true.
      #   max_workflows:    L1 — max concurrent workflow runs under one leader (>=1).
      #   agents_per_run:   L2 — per-run agent admission cap (optional; None uses
      #                          the engine's default agents-per-run resolution).
      #   max_agents_total: L3 — global agent admission across all runs (>=1).
      swarmflow_concurrency:
        max_workflows: 16
        agents_per_run: null
        max_agents_total: 64

      # Enable the host-managed worktree capability used by team members and
      # SwarmFlow agent calls with options.isolation="worktree".
      worktree:
        enabled: true

      # 任务调度模式（TeamAgentSpec.dispatch_mode，静态配置，运行时不可切换）：
      #   autonomous（默认）— 任务放到共享看板，成员按专长自行认领，
      #                        leader 通过 send_message 广播启动。
      #   scheduled        — leader 把每个任务预先指派给具名成员，
      #                        F_62 调度运行时（agent/scheduling）统一处理
      #                        start / 送审 / 返工 / 验收等 leader 身份的
      #                        邮箱消息；成员失去 claim_task，改用
      #                        member_complete_task。
      dispatch_mode: autonomous

      # 调度模式下的验收开关（TeamAgentSpec.enable_task_verification）：
      # 纯 prompt 驱动，开启后 leader 建任务时会按自己的判断给部分任务
      # 指派 0..N 个 reviewer（无强制校验，leader 认为无需验收的任务可以
      # 不带 reviewer）。reviewer 机制（列、guard、投票）本身始终可用，
      # 与本开关无关；本开关只影响 leader 的建任务引导语。见 F_62。
      enable_task_verification: false

      # 调度模式下的成员间通信开关（TeamAgentSpec.enable_member_messaging）：
      # 默认关闭时成员的 send_message 只能发给 leader / user，成员间信息由
      # leader 转达；开启后成员可点对点、多播、广播给其他成员，任务指派与
      # 交接仍归 leader 和调度框架。autonomous 模式下忽略。见 core F_126。
      enable_member_messaging: false

      # 调度模式下的成员子任务开关（TeamAgentSpec.max_subtask_depth）：
      # 0 表示关闭，此时只有 leader 能建任务；大于 0 时成员可以用 create_task
      # 把自己正在执行的任务拆成子任务，交给自己或其他已有成员。拆分后父任务
      # 挂起为 blocked、不占成员名额，子任务全部结束后由调度框架恢复给原承担者；
      # 子任务不单独向 leader 汇报。取值同时是嵌套层数上限（leader 的任务为
      # 第 0 层，成员拆出的子任务为第 1 层……）。设置页开关打开时写入 2。
      # autonomous 模式下忽略。见 core F_128。
      max_subtask_depth: 0

      leader:
        member_name: team-leader
        display_name: 团队领导
        persona: "天才项目管理专家，擅长任务分解和团队协调"

      agents:
        leader: $agent_leader

      workspace:
        enabled: true

      transport:
        type: inprocess

      storage:
        type: sqlite

      # ============================================================
      # Team 级共享记忆（TeamMemoryConfig）
      # ============================================================
      # 与常规 Agent 的 per-session 记忆不同，Team 记忆是一个独立的、
      # 跨成员的共享记忆系统，由 TeamMemoryManager 统一管理。
      #
      # 启用后，每个 Team 成员的记忆操作不再是孤立的个人记忆，
      # 而是读写同一份 TEAM_MEMORY.md（位于 team_memory_dir 下）。
      # 这允许成员之间通过记忆文件共享上下文（如项目背景、决策记录等）。
      # ============================================================
      memory:
        # ---------- 总开关 ----------
        # 关闭时 TeamMemoryManager 不创建，成员记忆回退到各自独立的 MemoryRail
        enabled: false

        # ---------- 场景标识 ----------
        # "general" — 通用场景，记忆提取 prompt 偏重项目背景与决策
        # "coding"  — 编码场景，记忆提取 prompt 偏重技术方案与架构决策
        scenario: "general"

        # ---------- 自动提取 ----------
        # true  — 每轮对话结束后，后台自动总结并写入 TEAM_MEMORY.md
        # false — 仅当 LLM 主动调用记忆工具时才写入
        # 仅在 lifecycle=persistent 时生效；temporary 团队不触发自动提取
        auto_extract: true

        # ---------- 共享记忆 ----------
        # true  — 所有成员共享同一份 TEAM_MEMORY.md（默认）
        # false — 每个成员维护独立记忆文件（按 member_name 分目录）
        shared_memory: true

        # ---------- 记忆注入模式 ----------
        # 控制记忆内容如何注入到每个成员的 system prompt 中：
        #   "proactive" — 每轮对话开始时主动注入最新记忆摘要
        member_memory_prompt_mode: "proactive"
